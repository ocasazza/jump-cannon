[package]
name = "graph-metrics"
version = "1.0.0"
edition = "2021"
description = "Graph metric computation for VaultGraph (degree, PageRank, betweenness, k-core, WCC, Louvain)"

[dependencies]
vault-data = { path = "../vault-data" }
petgraph   = { workspace = true }
rand       = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
pprof = { version = "0.13", features = ["criterion", "protobuf-codec"] }
proptest = "1"

# Run via `cargo run --release -p graph-metrics --example bench_metrics -- --bench`.
# An example rather than a [[bench]] target so it survives crane's mkDummySrc.
