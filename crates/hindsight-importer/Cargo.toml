[package]
name = "hindsight-importer"
version = "1.0.0"
edition = "2021"
description = "Hindsight memory-bank importer: polls one bank of a Hindsight HTTP API (memory units, entities, documents, and their graph)"

[dependencies]
vault-data  = { path = "../vault-data" }
data-loader = { path = "../data-loader" }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = "0.1"
parking_lot = "0.12"

[dev-dependencies]
tokio = { workspace = true }
