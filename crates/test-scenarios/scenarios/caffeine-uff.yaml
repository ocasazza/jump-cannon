# Deterministic molecular layout test bed (configuration-as-code).
#
# The caffeine V3000 fixture (authored 2D depiction, UFF-typed bonds) is
# laid out by the GPU force sim under pinned, molecular-scale options.
# Gates: precision (identical reruns bit-identical), accuracy (bonds vs
# UFF targets, ring angle sums, planarity), stochastic (seeded 3D jitter
# runs must recover the same gates).
name: caffeine-uff

source:
  package: charts/jump-cannon/packages/sdf.toml
  input: charts/jump-cannon/packages/examples/sdf-caffeine.txt

sim:
  steps: 600
  options:
    # Molecular scale: spring_len anchors at the caffeine mean UFF rest
    # (~1.33 Å) so authored positions are not rescaled away from the UFF
    # targets the accuracy gates measure against. Repulsion acts only on
    # near neighbors (radius 3.0 ≈ 1-3/1-4 pairs): enough to open ring
    # angles, too weak to stretch bonds (measured mean err 7%).
    spring_len: 1.4
    spring_k: 1.0
    repulsion: 0.02
    repulsion_radius: 3.0
    repulsion_mode: grid
    grid_enabled: false          # 24 atoms: exact O(n²) pairs, no voxel noise
    gravity: 0.0
    damping: 0.90
    dt: 0.10
    steps_per_call: 8
    cooling_alpha: 1.0           # no cooling: the config is the physics
    energy_threshold: 0.0        # run all 600 steps
    seed_mode: none              # authored positions are deliberate

precision:
  # Two identical runs of the same graph + options must produce
  # bit-identical final positions on the same device.
  repeat_runs: 2

accuracy:
  # Bond accuracy vs UFF targets: the strict gate (measured 7% mean,
  # 21% max at this config).
  bond_rel_tol: 0.30
  min_bond_fraction: 1.0
  max_mean_bond_rel_err: 0.10   # measured 5.4%
  max_bond_rel_err: 0.25        # measured 15.7%
  min_bond_len: 0.5
  planarity_tol: 0.001
  # Per-angle sanity band: the force field has NO angle terms, so ideal
  # 120°/108° are not reachable; ±60° rejects folded/inverted vertices
  # (measured deviations at this config: 6-ring ≤ 40°, 5-ring ≤ 15°).
  angles:
    # Pyrimidinedione six-ring (ideal 120°) — SDF atom ids 1..6.
    - { name: "ring6 at N1", atoms: ["6", "1", "2"], deg: 120, tol: 60 }
    - { name: "ring6 at C2", atoms: ["1", "2", "3"], deg: 120, tol: 60 }
    - { name: "ring6 at N3", atoms: ["2", "3", "4"], deg: 120, tol: 60 }
    - { name: "ring6 at C4", atoms: ["3", "4", "5"], deg: 120, tol: 60 }
    - { name: "ring6 at C5", atoms: ["4", "5", "6"], deg: 120, tol: 60 }
    - { name: "ring6 at C6", atoms: ["5", "6", "1"], deg: 120, tol: 60 }
    # Imidazole five-ring (ideal 108°) — fused atoms 4/5 plus 9/10/11.
    - { name: "ring5 at N9", atoms: ["4", "9", "10"], deg: 108, tol: 60 }
    - { name: "ring5 at C8", atoms: ["9", "10", "11"], deg: 108, tol: 60 }
    - { name: "ring5 at N7", atoms: ["10", "11", "5"], deg: 108, tol: 60 }
  # Ring closure: the interior-angle sum of a simple planar n-gon is
  # (n−2)·180° no matter how the bond-only field flexes the ring. A
  # folded or self-intersecting ring breaks the sum; 3D skew lowers it,
  # so the tolerance absorbs stochastic-run non-planarity.
  ring_sums:
    - { name: "pyrimidinedione", atoms: ["1", "2", "3", "4", "5", "6"], deg: 720, tol: 60 }
    - { name: "imidazole", atoms: ["4", "9", "10", "11", "5"], deg: 540, tol: 60 }

stochastic:
  runs: 12
  seed0: 1337
  steps: 600
  # Gaussian jitter on the authored start (σ in world units ≈ Å): tests
  # that the UFF basin is attractive from a perturbed 3D neighborhood.
  jitter_sigma: 0.3
  gates:
    # Distribution gates over seeded jitter runs; measured at this config:
    # bond fraction 88-100%, angle dev ≤ 65°, ring-sum dev ≤ 125°,
    # p95 max bond err 61.5%. Headroom ~15% on every gate.
    min_pass_fraction: 0.9
    p95_bond_rel_err: 0.70
    min_run_bond_fraction: 0.85
    angle_tol: 70
    ring_sum_tol: 150

# Full-noise starts: the angle-free field cannot fold a random 3D ball
# into caffeine (bond-spring entanglement is a real local minimum), so
# the gate is bounded-and-finite only — an integrator regression tripwire,
# not an accuracy claim.
robustness:
  runs: 4
  seed0: 777
  steps: 600
  max_position_norm: 100.0
