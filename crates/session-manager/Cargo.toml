[package]
name = "session-manager"
version = "1.0.0"
edition = "2021"
description = "Abstract world/session interface (WorldHost), the embedded single-user implementation, the Kubernetes multi-user server, and the HTTP client"

[features]
# Exposes the reusable `conformance` module for external WorldHost
# implementations (Kubernetes, HTTP client) to plug into. Always compiled
# for this crate's own tests.
conformance = []
# The multi-user server: the `session-manager` binary, the
# `KubernetesSessionManager` host, and the per-world graph-api serving
# states. Native-only (graph-api does not build for wasm32); the default
# build stays wasm32-clean.
server = [
    "dep:graph-api",
    "dep:data-loader",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:clap",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:kube",
    "dep:k8s-openapi",
    # The TerminusDB store backend is native-only, so it rides the server
    # feature; `--store minigraf` (the default) never touches it.
    "graph-vcs/terminus",
]

[dependencies]
graph-vcs  = { path = "../graph-vcs" }
vault-data = { path = "../vault-data" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = "2"
# HTTP transport for `HttpSessionManager`: browser fetch on wasm32, plain
# HTTP on native (no TLS backend is compiled in — deployments terminate TLS
# at the ingress in front of the server).
reqwest    = { version = "0.12", default-features = false, features = ["json"] }

# `server` feature only (native).
graph-api          = { path = "../graph-api", optional = true }
data-loader        = { path = "../data-loader", optional = true }
axum               = { version = "0.7", optional = true }
tower              = { version = "0.4", features = ["util"], optional = true }
tower-http         = { version = "0.5", features = ["cors"], optional = true }
tokio              = { workspace = true, optional = true }
clap               = { version = "4", features = ["derive", "env"], optional = true }
anyhow             = { version = "1", optional = true }
tracing            = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# kube/k8s-openapi pins mirror crates/graph-api's gpu_session exactly (the
# per-world broker reuses its session loop and dynamic-API conventions).
kube               = { version = "4.2", default-features = true, optional = true }
k8s-openapi        = { version = "0.28", features = ["latest"], optional = true }

# The wasm HTTP path ships each request through `spawn_local` + a oneshot so
# the !Send web-sys internals never cross the traits' `Send` futures.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures              = { version = "0.3", default-features = false, features = ["std", "async-await"] }
wasm-bindgen-futures = "0.4"
# localStorage for the embedded host's browser persistence
# (`EmbeddedSessionManager::open_persistent`).
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[dev-dependencies]
tempfile = "3"
tokio    = { workspace = true }

[[bin]]
name = "session-manager"
path = "src/bin/session-manager/main.rs"
required-features = ["server"]
