[package]
name = "http-json-importer"
version = "1.0.0"
edition = "2021"
description = "Declarative HTTP/JSON importer engine: reads paged JSON APIs into the canonical graph from a versioned TOML package"

[dependencies]
vault-data  = { path = "../vault-data" }
data-loader = { path = "../data-loader" }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = "0.8"
tracing     = "0.1"

[dev-dependencies]
tokio       = { workspace = true }
parking_lot = "0.12"
