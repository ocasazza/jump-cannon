[package]
name = "importer"
version = "1.0.0"
edition = "2021"
description = "Unified runtime importer engine: format_version 3 packages select a pest or json engine under one shared envelope"

[features]
default = ["native"]
# Native-only effects: filesystem package binding and the reqwest HTTP
# transport. The package core (manifest validation, pest_vm parsing, JSON
# decode/mapping over caller-supplied bytes) builds on wasm32-unknown-unknown
# with --no-default-features.
native = ["dep:reqwest", "dep:tvix-wasm", "dep:tokio"]

[dependencies]
data-loader = { path = "../data-loader" }
vault-data  = { path = "../vault-data" }
pest        = "=2.8.8"
pest_meta   = "=2.8.8"
pest_vm     = "=2.8.8"
semver      = "1"
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = "2"
toml        = "0.8"
tracing     = "0.1"
blake3      = "1"
# rustls-tls-native-roots, NOT rustls-tls: the bundled webpki roots ignore
# SSL_CERT_FILE, so behind the Schrodinger Fortigate (which re-signs every
# outbound chain) every request fails x509 verification inside a container.
# Native roots read the host bundle the deployment mounts.
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
# Native-only: the tvix engine evaluates Nix generator expressions on a
# blocking thread. tvix-wasm builds a pure (default-features off) native
# evaluator; tokio provides spawn_blocking. The package core (validation,
# variable resolution, Nix-literal rendering) is wasm-clean without them.
tvix-wasm   = { path = "../tvix-wasm", default-features = false, optional = true }
tokio       = { workspace = true, optional = true }

[dev-dependencies]
tempfile    = "3"
tokio       = { workspace = true }
parking_lot = "0.12"
rstest      = "0.25"
