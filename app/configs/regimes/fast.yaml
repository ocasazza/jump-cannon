# Fast — the vault-tuned "converge quickly, accept a rougher layout" base,
# migrated verbatim from the deleted `LayoutPreset::Fast` (app/ui/src/panels/
# layout.rs). `auto: false` keeps it out of automatic resolution: presets are
# a deliberate user choice, not a graph property (the vault regimes own
# auto-resolution).
id: fast
schema_version: 1
label: "Fast"
description: "Quick convergence on vault-scale graphs; rougher final layout."
engine: gpu-force
execution: live
auto: false
applicability:
  engine_kind: [local]
options:
  repulsion: 150.0
  spring_k: 0.10
  spring_len: 40.0
  gravity: 0.005
  damping: 0.85
  dt: 0.045
  steps_per_call: 1
  cooling_alpha: 0.99
  cooling_floor: 0.65
  energy_threshold: 0.5
controls:
  # Dimensionless intents over the resolved base (spec §2 `controls`):
  # `maps_to` gives the exponent applied to the multiplier, so Settle scales
  # the halt threshold up while easing cooling down (both clamped to the
  # ranges the engine can use).
  - { id: repulsion, kind: multiplier, label: "Repulsion", range: [0.5, 2.0] }
  - { id: spread, kind: multiplier, label: "Spread", range: [0.5, 2.0], maps_to: { spring_len: 1.0 } }
  - { id: stiffness, kind: multiplier, label: "Stiffness", range: [0.5, 2.0], maps_to: { spring_k: 1.0 } }
  - { id: settle, kind: multiplier, label: "Settle", range: [0.5, 2.0], maps_to: { energy_threshold: 1.0, cooling_alpha: -1.0 } }
