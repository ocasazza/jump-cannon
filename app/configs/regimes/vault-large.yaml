# Vault (large) — untyped graphs from 1k nodes up. The base stays n-tuned:
# `GpuForceOptions::for_n_nodes` scales spring_len, repulsion, the repulsion
# clip, and the auto-halt threshold with the cube root of the node count, and
# no YAML value can express that. What this regime declares as data is the
# one large-graph choice that is NOT a function of n: the repulsion backend.
# Barnes-Hut wins once a uniform voxel starts collecting hundreds of bodies
# (real vaults: a few hubs plus long sparse tails).
id: vault-large
schema_version: 1
label: "Vault · large"
description: "Untyped graphs from 1k nodes; n-tuned base with the Barnes-Hut backend."
engine: gpu-force
execution: live
applicability:
  min_nodes: 1000
options:
  repulsion_mode: barnes_hut
controls:
  # Dimensionless intents over the resolved base (spec §2 `controls`):
  # `maps_to` gives the exponent applied to the multiplier, so Settle scales
  # the halt threshold up while easing cooling down (both clamped to the
  # ranges the engine can use).
  - { id: repulsion, kind: multiplier, label: "Repulsion", range: [0.5, 2.0] }
  - { id: spread, kind: multiplier, label: "Spread", range: [0.5, 2.0], maps_to: { spring_len: 1.0 } }
  - { id: stiffness, kind: multiplier, label: "Stiffness", range: [0.5, 2.0], maps_to: { spring_k: 1.0 } }
  - { id: settle, kind: multiplier, label: "Settle", range: [0.5, 2.0], maps_to: { energy_threshold: 1.0, cooling_alpha: -1.0 } }
