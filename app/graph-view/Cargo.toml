[package]
name = "jump-cannon-graph-view"
version = "1.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "graph_view"

[dependencies]
dioxus = { version = "0.6", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Loose: the consuming app pins the exact wasm-bindgen its CLI ships.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
tracing = "0.1"
# WebGPU renderer: node/edge WGSL pipelines, 6DoF camera, in-process GPU
# force layout bound to the shared positions buffer.
wgpu = { version = "23", default-features = false, features = ["webgpu", "wgsl", "fragile-send-sync-non-atomic-wasm"] }
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
# The GPU force-sim compute layout.
graph-layouts = { path = "../../crates/graph-layouts" }
