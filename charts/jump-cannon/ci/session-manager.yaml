# helm-template coverage for the deployer shape: session-manager with the
# per-world GPU broker in the gpu-workloads namespace, no chart-owned compute.
sessionManager:
  enabled: true
  gpu:
    enabled: true

graphCompute:
  enabled: false
  namespace: gpu-workloads
  session:
    enabled: false

tests:
  fuzz:
    enabled: false
  performance:
    enabled: false
  browser:
    enabled: false
