nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: gar-pull

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# Additional namespace-local identities for companion ingestion components.
# This chart creates only the ServiceAccounts; each component must select its
# account in its own pod spec. No RBAC permissions are implied or created.
additionalServiceAccounts: {}
  # lavender-ingest:
  #   annotations:
  #     iam.gke.io/gcp-service-account: lavender-ingest@example.iam.gserviceaccount.com
  #   labels:
  #     app.kubernetes.io/component: ingestion
  #   automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

graphApi:
  replicas: 1
  # Source identifier understood by graph-api. Enabling the Kubernetes
  # importer below selects kubernetes regardless of this value. Set this to
  # okf to load an Open Knowledge Format bundle from the vault mount. Set
  # this to github to pull the knowledge corpus from a GitHub repository
  # (see githubImporter below) instead of the vault filesystem.
  source: obsidian
  # Optional full-rescan fallback for non-OKF filesystem sources. Set this
  # above 0 when writes arrive through another pod or mount.
  filesystemRescanIntervalSeconds: 0
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-graph-api
    tag: latest
    pullPolicy: Always
  port: 8765
  rustLog: info
  computeUrl: http://jump-cannon-compute:50051
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# Named importer profiles provide an operator-facing catalog without removing
# the legacy graphApi.source / kubernetesImporter.enabled configuration. An
# empty selection preserves that legacy behavior exactly. The chart currently
# wires named Obsidian, Kubernetes, and OKF profiles; other graph-api source
# kinds remain available through their source-specific CLI configuration.
importers:
  selected: ""
  # NetBird group allowed to switch the viewed source at runtime from
  # Settings > Importers (per browser session, read-only graph views; writes
  # and compute stay on the deployment-selected source). Empty disables
  # runtime switching entirely and preserves the rollout-only behavior where
  # importers.selected is the only way to change the active source.
  # Non-empty also mounts every configured filesystem source's claim
  # read-only, so only set it once every dormant profile's producer claim
  # exists in this namespace — a missing claim blocks pod startup.
  runtimeSwitchGroup: ""
  sources:
    lavender-ingest-okf:
      displayName: Lavender Ingest OKF
      description: Read the OKF v0.2 repository maintained by lavender-ingest from a same namespace, deployment-provisioned RWX claim. The writer defaults to lavender-ingest-okf (<release>-okf), and files must be readable by UID/GID 10001.
      kind: okf
      sourceId: lavender-ingest
      filesystemRescanIntervalSeconds: 60
      source:
        volumeName: lavender-okf-repository
        existingClaim: lavender-okf-shared
        mountPath: /var/lib/lavender/okf-repository
        path: /var/lib/lavender/okf-repository/okf
        readOnly: true
      producer:
        chart: lavender-ingest
        defaultClaim: lavender-ingest-okf
        repositoryRoot: /data/okf-repository
        workflowInput: /data/okf-repository/okf
        existingClaimValuePath: okf.persistence.existingClaim
        existingClaimValue: lavender-okf-shared

# okf-sync CronJob: fast-forward git-pulls the lavender OKF repository
# (pushed nightly by lavender-ingest) into the shared claim an OKF importer
# profile serves from. The claim and mount path are derived from the catalog
# profile itself (the selected OKF profile, or the catalog's single OKF
# profile) so this job can never drift from the reader. The claim is RWO
# local-path and graph-api already mounts it read-only, so the sync pod
# carries a hard podAffinity to the graph-api pod's node. Sync divergence is
# never resolved: the job fails loudly for an operator.
okfSync:
  enabled: false
  schedule: "17 * * * *"
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-okf-sync
    tag: latest
    pullPolicy: Always
  repoUrl: "git@github.com:schrodinger/lavender-okf.git"
  # Name of a user-created Secret holding the read-only GitHub deploy key at
  # key id_ed25519; mounted read-only at /secrets/okf-reader with mode 0400.
  deployKeySecret: "lavender-okf-reader"

# ASCII slug used to namespace graph node IDs when graphApi.source is okf.
# The OKF bundle itself is read from vault.mountPath.
okfImporter:
  sourceId: default
  # Cross-pod writes on some CSI/NFS/RWX volumes do not reliably produce
  # inotify events in the graph-api pod. Set to 0 only when notifications are
  # known to propagate; increase this interval for especially large bundles.
  filesystemRescanIntervalSeconds: 60

# GitHub docs-importer mode, selected with graphApi.source: github. graph-api
# downloads the repository tarball (codeload) for the configured ref, extracts
# it into an ephemeral pod cache, and parses the configured subdirectory with
# the same Obsidian markdown pipeline the vault filesystem source uses. This
# is the docs-importer mode: knowledge updates flow push-to-main -> poll ->
# rebuild without a chart republish. The vault ConfigMap sync remains the
# fallback under graphApi.source: obsidian and is untouched by this mode.
githubImporter:
  repo: "ocasazza/jump-cannon"
  ref: "main"
  path: "charts/jump-cannon/knowledge"
  pollIntervalSeconds: 60
  # Ephemeral extraction cache mounted as an emptyDir in the graph-api pod.
  cacheDir: "/var/cache/jump-cannon/github"
  # Token for private mirrors comes from an existing Secret, never values:
  #   tokenSecret: { name: "jump-cannon-github", key: "token" }
  tokenSecret:
    name: ""
    key: "token"

# Import Kubernetes API resources as graph nodes. The importer package is
# configuration only; credentials and RBAC remain host-owned effects.
kubernetesImporter:
  enabled: false
  mountPath: /etc/jump-cannon/kubernetes
  config:
    source_id: in-cluster
    max_objects: 100000
    max_bytes: 134217728
    poll_interval_ms: 30000
    include_object: false
    allow_secrets: false
    resources:
      - group: ""
        version: v1
        kind: Pod
        # ConfigMap rendering expands this to the Helm release namespace.
        namespaces:
          - "{{ .Release.Namespace }}"
        label_selector: null
        field_selector: null
  serviceAccountToken:
    # Explicit projected token; pod-wide automount remains disabled.
    enabled: false
    expirationSeconds: 3600
    audience: ""
  rbac:
    # Creates a Role and RoleBinding only in the Helm release namespace.
    # The only granted verb is list, matching the metadata-only polling client.
    create: false
    rules: []
    # Example:
    #   - apiGroups: [""]
    #     resources: ["pods"]
    #   - apiGroups: ["apps"]
    #     resources: ["deployments", "replicasets"]

vault:
  mountPath: /vault
  persistence:
    enabled: true
    # Mount a claim created by another chart (for example lavender-ingest).
    # When non-empty, jump-cannon does not render its own PVC.
    existingClaim: ""
    storageClassName: local-path
    size: 5Gi
  seed:
    enabled: true
    image: docker.io/library/busybox:1.36.1
    # Sync the chart-owned documentation into /vault/Jump Cannon. These files
    # are source-controlled under charts/jump-cannon/knowledge and are replaced
    # on rollout. Put user-owned content elsewhere in the vault.
    includeKnowledgeBase: true
    # Additional non-secret files are copied to the vault root only when the
    # target does not already exist.
    files:
      Welcome.md: |
        # jump-cannon

        This vault is managed by the in-cluster jump-cannon deployment.

        Begin with [[Start Here]]. Test health is summarized in [[Performance]].
      Performance.md: |
        # Performance

        Cluster test jobs push their status to Pushgateway for Grafana.

        See [[Performance Engineering]], [[Scheduled Tests]], and [[Observability]].

graphCompute:
  enabled: true
  namespace: ""
  serviceAccountName: default
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  service:
    port: 50051
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-graph-compute
    tag: latest
    pullPolicy: Always
  rustLog: info
  tickHz: "30"
  bindAddr: "[::]:50051"
  # On-demand GPU session lifecycle. When enabled, the chart does NOT create
  # the RayCluster CR; instead it renders the identical manifest into the
  # <fullname>-gpu-session-template ConfigMap mounted into graph-api, which
  # creates/deletes the RayCluster on demand (explicit dispatch/park,
  # idle auto-park, hard time cap) within the standing Kueue quota envelope.
  # The compute Service always renders (zero endpoints while parked).
  # Requires graphApi.replicas == 1 (enforced by a chart fail).
  session:
    enabled: false
    # Seconds of no cluster-engine activity before the session auto-parks.
    idleSeconds: 900
    # Seconds to wait for Kueue admission before failing the session.
    admissionTimeoutSeconds: 600
    # Hard cap on session lifetime in seconds. Also stamped onto the
    # RayCluster as the kueue.x-k8s.io/max-exec-time-seconds label in BOTH
    # modes (Kueue-enforced safety rail).
    maxExecTimeSeconds: 14400
    # Seconds to wait for the Ray head pod to become ready after admission.
    headStartTimeoutSeconds: 900
  ray:
    image: rayproject/ray:2.52.0-py311@sha256:a601a539f3d881d644848690622cfa4d31e22d6cb3f5158e8b4bb96418d28da8
    rayVersion: "2.52.0"
    queueName: gpu
    workloadPriorityClassName: batch
    podPriorityClassName: gpu-batch
    ttlSeconds: 14400
    nodeSelector:
      nixstation.io/gpu-workload: elastic
    headResources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    backendResources:
      requests:
        cpu: "2"
        memory: 4Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: "1"

# Multi-user session-manager: world/session/VCS REST API plus per-world
# graph serving, backed by the world-store PVC. Disabled by default; the
# single-tenant graphApi deployment above remains the default surface.
sessionManager:
  enabled: false
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-session-manager
    tag: latest
    pullPolicy: Always
  port: 8080
  rustLog: info
  # In-memory controllers (world serving states, GPU session loops) live in
  # the pod, so exactly one replica is supported.
  replicas: 1
  # Trusted identity header set by the authenticating ingress; requests
  # without it get 401.
  userHeader: x-user
  # World store backend: minigraf (one <world-slug>.graph file per world on
  # the PVC) or terminusdb (one TerminusDB database per world; requires
  # terminusdb.enabled=true, enforced by a chart fail).
  store: minigraf
  persistence:
    enabled: true
    # Mount a claim created elsewhere; when non-empty the chart does not
    # render its own world-store PVC.
    existingClaim: ""
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Per-world GPU compute broker: one Kueue-admitted RayCluster per world,
  # lifecycle-managed by the session-manager (dispatch/park, idle auto-park,
  # hard caps) within the same standing LocalQueue envelope as
  # graphCompute.session. Mutually exclusive with graphCompute.session
  # (enforced by a chart fail); requires sessionManager.replicas == 1.
  gpu:
    enabled: false
    # Defaults to graphCompute.namespace (the release namespace when unset).
    namespace: ""
    idleSeconds: 900
    admissionTimeoutSeconds: 600
    maxExecTimeSeconds: 14400
    headStartTimeoutSeconds: 900

# TerminusDB backend for sessionManager.store=terminusdb: one database per
# world, served by a single-replica StatefulSet with its own PVC. Disabled by
# default. The admin password NEVER comes from values: create a Secret holding
# it and reference that Secret via adminPasswordSecret.
terminusdb:
  enabled: false
  image: terminusdb/terminusdb-server:v12.0.7
  service:
    port: 6363
  persistence:
    size: 10Gi
    # null = the cluster default storage class.
    storageClass: null
  adminPasswordSecret:
    # Name of a user-created Secret holding the TerminusDB admin password.
    # The chart fails to render when terminusdb is enabled without one.
    name: ""
    # Key within that Secret carrying the password.
    key: password

tests:
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-test-runner
    tag: latest
    pullPolicy: Always
  pushgatewayUrl: http://pushgateway.monitoring.svc.cluster.local:9091
  # Keep the test cadence independent of the controller-manager's local zone.
  timeZone: America/Los_Angeles
  commonResources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  fuzz:
    enabled: true
    suspend: false
    schedule: "0 0 * * *"
    cases: "10000"
    kueue:
      enabled: false
      queueName: gpu
      workloadPriorityClassName: batch
      podPriorityClassName: gpu-batch
  performance:
    enabled: true
    namespace: ""
    suspend: false
    schedule: "30 0 * * *"
    # Replace, not Forbid: a Kueue-held Job never stops being active, so Forbid
    # would let one queued run starve every following night.
    concurrencyPolicy: Replace
    # Bounds an admitted-then-hung benchmark. Suspended (queued) time does not
    # count toward it, so this never cancels a Job that is merely awaiting GPU.
    activeDeadlineSeconds: 3600
    includeHuge: "0"
    kueue:
      enabled: true
      queueName: gpu
      workloadPriorityClassName: batch
      podPriorityClassName: gpu-batch
    nodeSelector:
      nixstation.io/gpu-workload: elastic
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: "1"
  browser:
    enabled: true
    suspend: false
    schedule: "15 0 * * *"
    baseUrl: http://jump-cannon:80
    timeoutSeconds: "90"
    # Includes scheduling and the observed cold pull of the test-runner image
    # in addition to the 90-second in-process browser deadline.
    activeDeadlineSeconds: 900

# Grafana dashboards ship as labeled ConfigMaps (one per dashboards/*.json).
# The monitoring stack's Grafana sidecar watches the label and loads them.
grafanaDashboards:
  enabled: true
  label: grafana_dashboard
  labelValue: "1"
