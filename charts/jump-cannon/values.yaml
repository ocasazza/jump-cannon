nameOverride: ""
fullnameOverride: ""

imagePullSecrets:
  - name: gar-pull

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# Additional namespace-local identities for companion ingestion components.
# This chart creates only the ServiceAccounts; each component must select its
# account in its own pod spec. No RBAC permissions are implied or created.
additionalServiceAccounts: {}
  # lavender-ingest:
  #   annotations:
  #     iam.gke.io/gcp-service-account: lavender-ingest@example.iam.gserviceaccount.com
  #   labels:
  #     app.kubernetes.io/component: ingestion
  #   automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

graphApi:
  replicas: 1
  # Source identifier understood by graph-api. Enabling the Kubernetes
  # importer below selects kubernetes regardless of this value. Set this to
  # okf to load an Open Knowledge Format bundle from the vault mount.
  source: obsidian
  # Optional full-rescan fallback for non-OKF filesystem sources. Set this
  # above 0 when writes arrive through another pod or mount.
  filesystemRescanIntervalSeconds: 0
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-graph-api
    tag: latest
    pullPolicy: Always
  port: 8765
  rustLog: info
  computeUrl: http://jump-cannon-compute:50051
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# ASCII slug used to namespace graph node IDs when graphApi.source is okf.
# The OKF bundle itself is read from vault.mountPath.
okfImporter:
  sourceId: default
  # Cross-pod writes on some CSI/NFS/RWX volumes do not reliably produce
  # inotify events in the graph-api pod. Set to 0 only when notifications are
  # known to propagate; increase this interval for especially large bundles.
  filesystemRescanIntervalSeconds: 60

# Import Kubernetes API resources as graph nodes. The importer package is
# configuration only; credentials and RBAC remain host-owned effects.
kubernetesImporter:
  enabled: false
  mountPath: /etc/jump-cannon/kubernetes
  config:
    source_id: in-cluster
    max_objects: 100000
    max_bytes: 134217728
    poll_interval_ms: 30000
    include_object: false
    allow_secrets: false
    resources:
      - group: ""
        version: v1
        kind: Pod
        # ConfigMap rendering expands this to the Helm release namespace.
        namespaces:
          - "{{ .Release.Namespace }}"
        label_selector: null
        field_selector: null
  serviceAccountToken:
    # Explicit projected token; pod-wide automount remains disabled.
    enabled: false
    expirationSeconds: 3600
    audience: ""
  rbac:
    # Creates a Role and RoleBinding only in the Helm release namespace.
    # The only granted verb is list, matching the metadata-only polling client.
    create: false
    rules: []
    # Example:
    #   - apiGroups: [""]
    #     resources: ["pods"]
    #   - apiGroups: ["apps"]
    #     resources: ["deployments", "replicasets"]

vault:
  mountPath: /vault
  persistence:
    enabled: true
    # Mount a claim created by another chart (for example lavender-ingest).
    # When non-empty, jump-cannon does not render its own PVC.
    existingClaim: ""
    storageClassName: local-path
    size: 5Gi
  seed:
    enabled: true
    image: docker.io/library/busybox:1.36.1
    # Sync the chart-owned documentation into /vault/Jump Cannon. These files
    # are source-controlled under charts/jump-cannon/knowledge and are replaced
    # on rollout. Put user-owned content elsewhere in the vault.
    includeKnowledgeBase: true
    # Additional non-secret files are copied to the vault root only when the
    # target does not already exist.
    files:
      Welcome.md: |
        # jump-cannon

        This vault is managed by the in-cluster jump-cannon deployment.

        Begin with [[Start Here]]. Test health is summarized in [[Performance]].
      Performance.md: |
        # Performance

        Cluster test jobs push their status to Pushgateway for Grafana.

        See [[Performance Engineering]], [[Scheduled Tests]], and [[Observability]].

graphCompute:
  enabled: true
  namespace: ""
  serviceAccountName: default
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  service:
    port: 50051
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-graph-compute
    tag: latest
    pullPolicy: Always
  rustLog: info
  tickHz: "30"
  bindAddr: "[::]:50051"
  ray:
    image: vllm/vllm-openai@sha256:e4f88a835143cd22aee2397a26ec6bb80b3a4a6fe0c882bcbc63822904766089
    rayVersion: "2.52.0"
    queueName: gpu
    workloadPriorityClassName: batch
    podPriorityClassName: gpu-batch
    ttlSeconds: 14400
    nodeSelector:
      nixstation.io/gpu-workload: elastic
    headResources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    backendResources:
      requests:
        cpu: "2"
        memory: 4Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: "1"

tests:
  image:
    repository: us-central1-docker.pkg.dev/it-ops-nixstation/lavender/jump-cannon-test-runner
    tag: latest
    pullPolicy: Always
  pushgatewayUrl: http://pushgateway.monitoring.svc.cluster.local:9091
  # Keep the test cadence independent of the controller-manager's local zone.
  timeZone: America/Los_Angeles
  commonResources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  fuzz:
    enabled: true
    suspend: false
    schedule: "0 0 * * 0"
    cases: "10000"
    kueue:
      enabled: false
      queueName: gpu
      workloadPriorityClassName: batch
      podPriorityClassName: gpu-batch
  performance:
    enabled: true
    namespace: ""
    suspend: false
    schedule: "30 0 * * 0"
    includeHuge: "0"
    kueue:
      enabled: true
      queueName: gpu
      workloadPriorityClassName: batch
      podPriorityClassName: gpu-batch
    nodeSelector:
      nixstation.io/gpu-workload: elastic
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
        nvidia.com/gpu: "1"
      limits:
        cpu: "4"
        memory: 8Gi
        nvidia.com/gpu: "1"
  browser:
    enabled: true
    suspend: false
    schedule: "15 0 * * 0"
    baseUrl: http://jump-cannon:80
    timeoutSeconds: "90"
    # Includes scheduling and a cold pull of the test-runner image in addition
    # to the 90-second in-process browser deadline.
    activeDeadlineSeconds: 300
