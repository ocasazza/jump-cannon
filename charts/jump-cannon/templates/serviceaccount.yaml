{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jump-cannon.serviceAccountName" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- range $name, $account := .Values.additionalServiceAccounts }}
{{- $account = $account | default dict }}
{{- if and $.Values.serviceAccount.create (eq $name (include "jump-cannon.serviceAccountName" $)) }}
{{- fail (printf "additionalServiceAccounts[%q] duplicates the graph-api ServiceAccount" $name) }}
{{- end }}
{{- $labels := mergeOverwrite (dict) (include "jump-cannon.labels" $ | fromYaml) ($account.labels | default dict) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  labels:
    {{- toYaml $labels | nindent 4 }}
  {{- with $account.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ if hasKey $account "automountServiceAccountToken" }}{{ $account.automountServiceAccountToken }}{{ else }}false{{ end }}
{{- end }}
