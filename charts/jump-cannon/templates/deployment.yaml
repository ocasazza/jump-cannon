{{- $importer := include "jump-cannon.importerSelection" . | fromJson -}}
{{- $graphSource := $importer.kind -}}
{{- $usesFilesystem := $importer.usesFilesystem -}}
{{- $usesKubernetes := $importer.usesKubernetes -}}
{{- $usesGitHub := eq $importer.kind "github" -}}
{{- $usesHttpJson := eq $importer.kind "httpjson" -}}
{{- $filesystemRescanSeconds := $importer.filesystemRescanIntervalSeconds -}}
{{- $hasKnowledge := and $importer.allowsSeeds .Values.vault.seed.enabled .Values.vault.seed.includeKnowledgeBase -}}
{{- $hasSeedFiles := and $importer.allowsSeeds .Values.vault.seed.enabled (gt (len .Values.vault.seed.files) 0) -}}
{{- $seedsVault := or $hasKnowledge $hasSeedFiles -}}
{{- $gpuSession := and .Values.graphCompute.enabled .Values.graphCompute.session.enabled -}}
{{- /* Dormant filesystem sources: when runtime switching is enabled
     (importers.runtimeSwitchGroup non-empty), every catalog entry with a
     source block whose volume differs from the selected importer's is also
     mounted read-only, so runtime per-user source switching can serve it
     without a rollout. Keep this gated on the switch group: mounting a
     dormant profile's claim makes it a hard pod dependency, so a profile
     whose producer claim is not provisioned yet would block every rollout.
     The seed-vault init container stays selected-only. */ -}}
{{- $dormantSources := list -}}
{{- if .Values.importers.runtimeSwitchGroup -}}
{{- range $id, $profile := .Values.importers.sources -}}
  {{- if and (kindIs "map" $profile) (hasKey $profile "source") (ne $profile.source.volumeName $importer.volumeName) -}}
    {{- $dormantSources = append $dormantSources $profile.source -}}
  {{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jump-cannon.fullname" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-api
spec:
  replicas: {{ .Values.graphApi.replicas }}
  selector:
    matchLabels:
      {{- include "jump-cannon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: graph-api
  template:
    metadata:
      labels:
        {{- include "jump-cannon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: graph-api
      {{- /* chart.appVersion carries the source revision (chart-tarball stamps
             it at package time), so a new build rolls the pods onto the new
             `latest` image even when no template or value changed. */}}
      annotations:
        chart.appVersion: {{ .Chart.AppVersion | quote }}
        {{- if $seedsVault }}
        checksum/vault-content: {{ printf "%s%s" (include (print $.Template.BasePath "/configmap-vault-knowledge.yaml") .) (include (print $.Template.BasePath "/configmap-vault-seed.yaml") .) | sha256sum }}
        {{- end }}
        {{- if $usesKubernetes }}
        checksum/kubernetes-importer-config: {{ toJson .Values.kubernetesImporter.config | replace "{{ .Release.Namespace }}" .Release.Namespace | sha256sum }}
        {{- end }}
        {{- if $gpuSession }}
        checksum/gpu-session-template: {{ include "jump-cannon.rayclusterManifest" . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "jump-cannon.serviceAccountName" . }}
      {{- /* The GPU session controller needs in-cluster API access to manage the
             session RayCluster, so session mode forces token automount on. */}}
      automountServiceAccountToken: {{ or .Values.serviceAccount.automountServiceAccountToken $gpuSession }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if $seedsVault }}
      initContainers:
        - name: seed-vault
          image: {{ .Values.vault.seed.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p "$VAULT_ROOT"
              {{- if $hasKnowledge }}
              managed_dir="$VAULT_ROOT/Jump Cannon"
              mkdir -p "$managed_dir"
              for source in /knowledge/*; do
                [ -f "$source" ] || continue
                cp -f "$source" "$managed_dir/$(basename "$source")"
              done
              {{- end }}
              {{- if $hasSeedFiles }}
              for source in /seed/*; do
                [ -f "$source" ] || continue
                target="$VAULT_ROOT/$(basename "$source")"
                [ -e "$target" ] || cp -f "$source" "$target"
              done
              {{- end }}
          env:
            - name: VAULT_ROOT
              value: {{ $importer.path | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: {{ $importer.volumeName }}
              mountPath: {{ $importer.mountPath }}
            {{- if $hasKnowledge }}
            - name: vault-knowledge
              mountPath: /knowledge
              readOnly: true
            {{- end }}
            {{- if $hasSeedFiles }}
            - name: vault-seed
              mountPath: /seed
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: graph-api
          image: {{ include "jump-cannon.graphApiImage" . | quote }}
          imagePullPolicy: {{ .Values.graphApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.graphApi.port }}
              protocol: TCP
          env:
            - name: GRAPH_API_HOST
              value: "0.0.0.0"
            - name: GRAPH_API_PORT
              value: {{ .Values.graphApi.port | quote }}
            - name: GRAPH_API_NO_BROWSER
              value: "true"
            - name: JUMP_CANNON_ASSETS_DIR
              value: /assets
            - name: JUMP_CANNON_SOURCE
              value: {{ $graphSource | quote }}
            - name: JUMP_CANNON_IMPORTER_CATALOG_JSON
              value: {{ dict "selected" .Values.importers.selected "sources" .Values.importers.sources | toJson | quote }}
            {{- if .Values.importers.runtimeSwitchGroup }}
            - name: JUMP_CANNON_IMPORTER_SWITCH_GROUP
              value: {{ .Values.importers.runtimeSwitchGroup | quote }}
            {{- end }}
            {{- if $usesKubernetes }}
            - name: JUMP_CANNON_KUBERNETES_CONFIG
              value: {{ printf "%s/config.json" .Values.kubernetesImporter.mountPath | quote }}
            {{- end }}
            {{- if eq $graphSource "okf" }}
            - name: JUMP_CANNON_OKF_SOURCE_ID
              value: {{ $importer.sourceId | quote }}
            {{- end }}
            {{- if $usesGitHub }}
            - name: JUMP_CANNON_GITHUB_REPO
              value: {{ .Values.githubImporter.repo | quote }}
            - name: JUMP_CANNON_GITHUB_REF
              value: {{ .Values.githubImporter.ref | quote }}
            - name: JUMP_CANNON_GITHUB_PATH
              value: {{ .Values.githubImporter.path | quote }}
            - name: JUMP_CANNON_GITHUB_POLL_INTERVAL_MS
              value: {{ mul (int .Values.githubImporter.pollIntervalSeconds) 1000 | quote }}
            - name: JUMP_CANNON_GITHUB_CACHE_DIR
              value: {{ .Values.githubImporter.cacheDir | quote }}
            {{- if .Values.githubImporter.tokenSecret.name }}
            - name: JUMP_CANNON_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.githubImporter.tokenSecret.name | quote }}
                  key: {{ .Values.githubImporter.tokenSecret.key | quote }}
            {{- end }}
            {{- end }}
            {{- if $usesHttpJson }}
            - name: JUMP_CANNON_IMPORTER_MANIFEST
              value: {{ printf "%s/%s" .Values.httpJsonImporter.mountPath .Values.httpJsonImporter.package | quote }}
            - name: JUMP_CANNON_IMPORTER_ENDPOINT
              value: {{ .Values.httpJsonImporter.endpoint | quote }}
            {{- if .Values.httpJsonImporter.variables }}
            - name: JUMP_CANNON_IMPORTER_VARS
              value: {{ include "jump-cannon.importerVars" . | quote }}
            {{- end }}
            - name: JUMP_CANNON_IMPORTER_POLL_INTERVAL_MS
              value: {{ mul (int .Values.httpJsonImporter.pollIntervalSeconds) 1000 | quote }}
            {{- if .Values.httpJsonImporter.sourceId }}
            - name: JUMP_CANNON_IMPORTER_SOURCE_ID
              value: {{ .Values.httpJsonImporter.sourceId | quote }}
            {{- end }}
            {{- if .Values.httpJsonImporter.tokenSecret.name }}
            - name: JUMP_CANNON_IMPORTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.httpJsonImporter.tokenSecret.name | quote }}
                  key: {{ .Values.httpJsonImporter.tokenSecret.key | quote }}
            {{- end }}
            {{- end }}
            {{- if $usesFilesystem }}
            - name: VAULT_ROOT
              value: {{ $importer.path | quote }}
            - name: JUMP_CANNON_FILESYSTEM_RESCAN_SECONDS
              value: {{ $filesystemRescanSeconds | quote }}
            {{- end }}
            - name: JUMP_CANNON_COMPUTE_URL
              value: {{ .Values.graphApi.computeUrl | quote }}
            {{- if $gpuSession }}
            - name: JUMP_CANNON_GPU_SESSION_TEMPLATE
              value: /etc/jump-cannon/gpu-session/raycluster.yaml
            - name: JUMP_CANNON_GPU_SESSION_CLUSTER_NAME
              value: {{ include "jump-cannon.computeName" . | quote }}
            - name: JUMP_CANNON_GPU_SESSION_NAMESPACE
              value: {{ include "jump-cannon.computeNamespace" . | quote }}
            - name: JUMP_CANNON_GPU_SESSION_IDLE_SECONDS
              value: {{ .Values.graphCompute.session.idleSeconds | quote }}
            - name: JUMP_CANNON_GPU_SESSION_ADMISSION_TIMEOUT
              value: {{ .Values.graphCompute.session.admissionTimeoutSeconds | quote }}
            - name: JUMP_CANNON_GPU_SESSION_MAX_SECONDS
              value: {{ .Values.graphCompute.session.maxExecTimeSeconds | quote }}
            - name: JUMP_CANNON_GPU_SESSION_HEAD_START_TIMEOUT
              value: {{ .Values.graphCompute.session.headStartTimeoutSeconds | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.graphApi.rustLog | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.graphApi.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if or $usesFilesystem $usesKubernetes $usesGitHub $usesHttpJson $gpuSession $dormantSources }}
          volumeMounts:
            {{- if $usesFilesystem }}
            - name: {{ $importer.volumeName }}
              mountPath: {{ $importer.mountPath }}
              {{- if $importer.readOnly }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- range $dormant := $dormantSources }}
            - name: {{ $dormant.volumeName }}
              mountPath: {{ $dormant.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $usesGitHub }}
            - name: github-importer-cache
              mountPath: {{ .Values.githubImporter.cacheDir | quote }}
            {{- end }}
            {{- if $usesHttpJson }}
            - name: importer-packages
              mountPath: {{ .Values.httpJsonImporter.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if $usesKubernetes }}
            - name: kubernetes-importer-config
              mountPath: {{ .Values.kubernetesImporter.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and $usesKubernetes .Values.kubernetesImporter.serviceAccountToken.enabled }}
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- if $gpuSession }}
            - name: gpu-session-template
              mountPath: /etc/jump-cannon/gpu-session/raycluster.yaml
              subPath: raycluster.yaml
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $usesFilesystem $usesKubernetes $usesGitHub $usesHttpJson $gpuSession $dormantSources }}
      volumes:
        {{- if $usesGitHub }}
        - name: github-importer-cache
          emptyDir: {}
        {{- end }}
        {{- if $usesHttpJson }}
        - name: importer-packages
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-importer-packages
        {{- end }}
        {{- range $dormant := $dormantSources }}
        - name: {{ $dormant.volumeName }}
          persistentVolumeClaim:
            claimName: {{ $dormant.existingClaim }}
            readOnly: true
        {{- end }}
        {{- if $usesFilesystem }}
        - name: {{ $importer.volumeName }}
          {{- if $importer.named }}
          persistentVolumeClaim:
            claimName: {{ $importer.claimName }}
            readOnly: {{ $importer.readOnly }}
          {{- else if .Values.vault.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "jump-cannon.vaultClaimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $hasKnowledge }}
        - name: vault-knowledge
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-vault-knowledge
            items:
              {{- range $path, $_ := .Files.Glob "knowledge/*.md" }}
              - key: {{ printf "doc-%s" (sha256sum $path | trunc 16) }}
                path: {{ base $path | quote }}
              {{- end }}
        {{- end }}
        {{- if $hasSeedFiles }}
        - name: vault-seed
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-vault-seed
        {{- end }}
        {{- end }}
        {{- if $usesKubernetes }}
        - name: kubernetes-importer-config
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-kubernetes-importer
        {{- end }}
        {{- if $gpuSession }}
        - name: gpu-session-template
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-gpu-session-template
        {{- end }}
        {{- if and $usesKubernetes .Values.kubernetesImporter.serviceAccountToken.enabled }}
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.kubernetesImporter.serviceAccountToken.expirationSeconds }}
                  {{- with .Values.kubernetesImporter.serviceAccountToken.audience }}
                  audience: {{ . | quote }}
                  {{- end }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- end }}
      {{- end }}
