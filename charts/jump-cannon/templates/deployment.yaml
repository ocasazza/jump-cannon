{{- $graphSource := ternary "kubernetes" .Values.graphApi.source .Values.kubernetesImporter.enabled -}}
{{- $usesVault := eq $graphSource "obsidian" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jump-cannon.fullname" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-api
spec:
  replicas: {{ .Values.graphApi.replicas }}
  selector:
    matchLabels:
      {{- include "jump-cannon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: graph-api
  template:
    metadata:
      labels:
        {{- include "jump-cannon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: graph-api
      {{- if .Values.kubernetesImporter.enabled }}
      annotations:
        checksum/kubernetes-importer-config: {{ toJson .Values.kubernetesImporter.config | replace "{{ .Release.Namespace }}" .Release.Namespace | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "jump-cannon.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and $usesVault .Values.vault.seed.enabled }}
      initContainers:
        - name: seed-vault
          image: {{ .Values.vault.seed.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              mkdir -p {{ .Values.vault.mountPath }}
              for source in /seed/*; do
                [ -f "$source" ] || continue
                target="{{ .Values.vault.mountPath }}/$(basename "$source")"
                [ -e "$target" ] || cp "$source" "$target"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vault
              mountPath: {{ .Values.vault.mountPath }}
            - name: vault-seed
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        - name: graph-api
          image: {{ include "jump-cannon.graphApiImage" . | quote }}
          imagePullPolicy: {{ .Values.graphApi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.graphApi.port }}
              protocol: TCP
          env:
            - name: GRAPH_API_HOST
              value: "0.0.0.0"
            - name: GRAPH_API_PORT
              value: {{ .Values.graphApi.port | quote }}
            - name: GRAPH_API_NO_BROWSER
              value: "true"
            - name: JUMP_CANNON_ASSETS_DIR
              value: /assets
            - name: JUMP_CANNON_SOURCE
              value: {{ $graphSource | quote }}
            {{- if .Values.kubernetesImporter.enabled }}
            - name: JUMP_CANNON_KUBERNETES_CONFIG
              value: {{ printf "%s/config.json" .Values.kubernetesImporter.mountPath | quote }}
            {{- end }}
            {{- if $usesVault }}
            - name: VAULT_ROOT
              value: {{ .Values.vault.mountPath | quote }}
            {{- end }}
            - name: JUMP_CANNON_COMPUTE_URL
              value: {{ .Values.graphApi.computeUrl | quote }}
            - name: RUST_LOG
              value: {{ .Values.graphApi.rustLog | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.graphApi.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- if or $usesVault .Values.kubernetesImporter.enabled }}
          volumeMounts:
            {{- if $usesVault }}
            - name: vault
              mountPath: {{ .Values.vault.mountPath }}
            {{- end }}
            {{- if .Values.kubernetesImporter.enabled }}
            - name: kubernetes-importer-config
              mountPath: {{ .Values.kubernetesImporter.mountPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.kubernetesImporter.enabled .Values.kubernetesImporter.serviceAccountToken.enabled }}
            - name: kubernetes-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or $usesVault .Values.kubernetesImporter.enabled }}
      volumes:
        {{- if $usesVault }}
        - name: vault
          {{- if .Values.vault.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "jump-cannon.fullname" . }}-vault
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.vault.seed.enabled }}
        - name: vault-seed
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-vault-seed
        {{- end }}
        {{- end }}
        {{- if .Values.kubernetesImporter.enabled }}
        - name: kubernetes-importer-config
          configMap:
            name: {{ include "jump-cannon.fullname" . }}-kubernetes-importer
        {{- end }}
        {{- if and .Values.kubernetesImporter.enabled .Values.kubernetesImporter.serviceAccountToken.enabled }}
        - name: kubernetes-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: {{ .Values.kubernetesImporter.serviceAccountToken.expirationSeconds }}
                  {{- with .Values.kubernetesImporter.serviceAccountToken.audience }}
                  audience: {{ . | quote }}
                  {{- end }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- end }}
      {{- end }}
