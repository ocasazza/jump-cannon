{{- include "jump-cannon.validateSessionManagerGpu" . -}}
{{- if and .Values.sessionManager.enabled .Values.sessionManager.gpu.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "jump-cannon.sessionManagerName" . }}-gpu-broker
  namespace: {{ include "jump-cannon.smComputeNamespace" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - workloads
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "jump-cannon.sessionManagerName" . }}-gpu-broker
  namespace: {{ include "jump-cannon.smComputeNamespace" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "jump-cannon.sessionManagerName" . }}-gpu-broker
subjects:
  - kind: ServiceAccount
    name: {{ include "jump-cannon.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
