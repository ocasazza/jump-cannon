{{- $importer := include "jump-cannon.importerSelection" . | fromJson -}}
{{- if and $importer.allowsSeeds .Values.vault.seed.enabled .Values.vault.seed.includeKnowledgeBase }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jump-cannon.fullname" . }}-vault-knowledge
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
{{/* Values must use `indent`: `nindent` hides byte-zero frontmatter. */}}
data:
  {{- range $path, $_ := .Files.Glob "knowledge/*.md" }}
  {{ printf "doc-%s" (sha256sum $path | trunc 16) }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
