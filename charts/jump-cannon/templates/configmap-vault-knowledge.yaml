{{- $graphSource := ternary "kubernetes" .Values.graphApi.source .Values.kubernetesImporter.enabled -}}
{{- if and (eq $graphSource "obsidian") .Values.vault.seed.enabled .Values.vault.seed.includeKnowledgeBase }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jump-cannon.fullname" . }}-vault-knowledge
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "knowledge/*.md" }}
  {{ printf "doc-%s" (sha256sum $path | trunc 16) }}: |-
{{ $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
