{{- if and .Values.graphCompute.enabled (not .Values.graphCompute.session.enabled) }}
{{ include "jump-cannon.computeJobManifest" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jump-cannon.computeName" . }}
  namespace: {{ include "jump-cannon.computeNamespace" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-compute
spec:
  type: ClusterIP
  selector:
    batch.kubernetes.io/job-name: {{ include "jump-cannon.computeName" . }}
  ports:
    - name: grpc
      port: {{ .Values.graphCompute.service.port }}
      targetPort: grpc
      protocol: TCP
{{- end }}
