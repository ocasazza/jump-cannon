{{- $graphSource := ternary "kubernetes" .Values.graphApi.source .Values.kubernetesImporter.enabled -}}
{{- $usesFilesystem := or (eq $graphSource "obsidian") (eq $graphSource "okf") -}}
{{- if and $usesFilesystem .Values.vault.persistence.enabled (not .Values.vault.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "jump-cannon.vaultClaimName" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.vault.persistence.storageClassName }}
  storageClassName: {{ .Values.vault.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.vault.persistence.size | quote }}
{{- end }}
