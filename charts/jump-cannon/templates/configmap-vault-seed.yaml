{{- $importer := include "jump-cannon.importerSelection" . | fromJson -}}
{{- if and $importer.allowsSeeds .Values.vault.seed.enabled (gt (len .Values.vault.seed.files) 0) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jump-cannon.fullname" . }}-vault-seed
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
{{/* Preserve byte-zero frontmatter in administrator-supplied seed notes. */}}
data:
  {{- range $name, $body := .Values.vault.seed.files }}
  {{ $name | quote }}: |-
{{ $body | indent 4 }}
  {{- end }}
{{- end }}
