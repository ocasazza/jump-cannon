{{- $graphSource := ternary "kubernetes" .Values.graphApi.source .Values.kubernetesImporter.enabled -}}
{{- if and (eq $graphSource "obsidian") .Values.vault.seed.enabled (gt (len .Values.vault.seed.files) 0) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jump-cannon.fullname" . }}-vault-seed
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
data:
  {{- range $name, $body := .Values.vault.seed.files }}
  {{ $name | quote }}: |-
{{ $body | nindent 4 }}
  {{- end }}
{{- end }}
