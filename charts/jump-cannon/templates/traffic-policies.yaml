{{- if and .Values.routing.enabled .Values.routing.backendPolicy.enabled }}
{{- $backend := .Values.routing.backendPolicy }}
# Route-scoped transport tuning. BackendTrafficPolicy may target an HTTPRoute
# (verified against the Envoy Gateway v1.4.2 CRD's targetRefs validation), so
# this changes nothing for other workloads sharing the Gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "jump-cannon.fullname" . }}-transport
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-api
    {{- with .Values.routing.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "jump-cannon.fullname" . }}
    {{- if and .Values.sessionManager.enabled .Values.routing.sessionManager.hostnames }}
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "jump-cannon.sessionManagerName" . }}
    {{- end }}
  timeout:
    http:
      {{- with $backend.requestTimeout }}
      # Must exceed the whole bundle download, not the median request.
      requestTimeout: {{ . | quote }}
      {{- end }}
      {{- with $backend.connectionIdleTimeout }}
      connectionIdleTimeout: {{ . | quote }}
      {{- end }}
  connection:
    {{- with $backend.bufferLimit }}
    bufferLimit: {{ . | quote }}
    {{- end }}
    {{- with $backend.socketBufferLimit }}
    socketBufferLimit: {{ . | quote }}
    {{- end }}
{{- end }}
{{- if and .Values.routing.enabled .Values.routing.clientPolicy.enabled }}
{{- include "jump-cannon.validateRouting" . }}
{{- $client := .Values.routing.clientPolicy }}
{{- $parent := .Values.routing.parentRef }}
---
# Downstream HTTP/2 tuning — the actual slow-link lever, because Envoy's
# per-stream window defaults to 64 KiB and a multi-megabyte body then spends
# its time waiting for window updates rather than sending bytes.
#
# WARNING: ClientTrafficPolicy can only attach to a Gateway (the CRD forbids
# every other kind and does not support sectionName), so this affects EVERY
# workload behind that Gateway. It is opt-in for exactly that reason; enable
# it only where this deployment owns the Gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "jump-cannon.fullname" . }}-client-transport
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph-api
    {{- with .Values.routing.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $parent.name | quote }}
  http2:
    {{- with $client.http2.initialStreamWindowSize }}
    initialStreamWindowSize: {{ . | quote }}
    {{- end }}
    {{- with $client.http2.initialConnectionWindowSize }}
    initialConnectionWindowSize: {{ . | quote }}
    {{- end }}
  {{- with $client.idleTimeout }}
  timeout:
    http:
      idleTimeout: {{ . | quote }}
  {{- end }}
  {{- with $client.bufferLimit }}
  connection:
    bufferLimit: {{ . | quote }}
  {{- end }}
{{- end }}
