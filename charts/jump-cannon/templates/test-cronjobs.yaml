{{- if .Values.tests.fuzz.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "jump-cannon.fullname" . }}-fuzz
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: fuzz-tests
spec:
  schedule: {{ .Values.tests.fuzz.schedule | quote }}
  {{- with .Values.tests.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.tests.fuzz.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "jump-cannon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fuzz-tests
        {{- if .Values.tests.fuzz.kueue.enabled }}
        kueue.x-k8s.io/queue-name: {{ .Values.tests.fuzz.kueue.queueName | quote }}
        kueue.x-k8s.io/priority-class: {{ .Values.tests.fuzz.kueue.workloadPriorityClassName | quote }}
        {{- end }}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "jump-cannon.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: fuzz-tests
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- if .Values.tests.fuzz.kueue.enabled }}
          priorityClassName: {{ .Values.tests.fuzz.kueue.podPriorityClassName | quote }}
          {{- end }}
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: fuzz
              image: {{ include "jump-cannon.testImage" . | quote }}
              imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
              command:
                - jump-cannon-fuzz
              env:
                - name: PUSHGATEWAY_URL
                  value: {{ .Values.tests.pushgatewayUrl | quote }}
                - name: PROPTEST_CASES
                  value: {{ .Values.tests.fuzz.cases | quote }}
              resources:
                {{- toYaml .Values.tests.commonResources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
---
{{- end }}
{{- if .Values.tests.performance.enabled }}
{{- $performanceNamespace := default .Release.Namespace .Values.tests.performance.namespace }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "jump-cannon.fullname" . }}-performance
  namespace: {{ $performanceNamespace }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: performance-tests
spec:
  schedule: {{ .Values.tests.performance.schedule | quote }}
  {{- with .Values.tests.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.tests.performance.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        {{- include "jump-cannon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: performance-tests
        {{- if .Values.tests.performance.kueue.enabled }}
        kueue.x-k8s.io/queue-name: {{ .Values.tests.performance.kueue.queueName | quote }}
        kueue.x-k8s.io/priority-class: {{ .Values.tests.performance.kueue.workloadPriorityClassName | quote }}
        {{- end }}
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "jump-cannon.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: performance-tests
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- if .Values.tests.performance.kueue.enabled }}
          priorityClassName: {{ .Values.tests.performance.kueue.podPriorityClassName | quote }}
          {{- end }}
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          nodeSelector:
            {{- toYaml .Values.tests.performance.nodeSelector | nindent 12 }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: performance
              image: {{ include "jump-cannon.testImage" . | quote }}
              imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
              command:
                - jump-cannon-perf
              env:
                - name: PUSHGATEWAY_URL
                  value: {{ .Values.tests.pushgatewayUrl | quote }}
                - name: BENCH_INCLUDE_1M
                  value: {{ .Values.tests.performance.includeHuge | quote }}
              resources:
                {{- toYaml .Values.tests.performance.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
---
{{- end }}
{{- if .Values.tests.browser.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "jump-cannon.fullname" . }}-browser
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: browser-tests
spec:
  schedule: {{ .Values.tests.browser.schedule | quote }}
  {{- with .Values.tests.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ .Values.tests.browser.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: {{ .Values.tests.browser.activeDeadlineSeconds }}
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "jump-cannon.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: browser-tests
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: browser
              image: {{ include "jump-cannon.testImage" . | quote }}
              imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
              command:
                - jump-cannon-browser-smoke
              env:
                - name: PUSHGATEWAY_URL
                  value: {{ .Values.tests.pushgatewayUrl | quote }}
                - name: JUMP_CANNON_BASE_URL
                  value: {{ .Values.tests.browser.baseUrl | quote }}
                - name: JUMP_CANNON_BROWSER_TIMEOUT_SECONDS
                  value: {{ .Values.tests.browser.timeoutSeconds | quote }}
              resources:
                {{- toYaml .Values.tests.commonResources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
{{- end }}
