{{- if and .Values.sessionManager.enabled .Values.sessionManager.gpu.enabled }}
{{- /* Per-world Job template for the session-manager GPU broker.
       metadata.name is the __world__ placeholder; the broker stamps
       <release>-<world-slug> per world at dispatch time. The max-exec label
       comes from sessionManager.gpu (not the legacy single-tenant session). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jump-cannon.sessionManagerName" . }}-gpu-world-template
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
data:
  job.yaml: |
    {{- include "jump-cannon.computeJobManifestNamed" (dict "root" . "jobName" "__world__" "namespace" (include "jump-cannon.smComputeNamespace" .) "maxExecSeconds" .Values.sessionManager.gpu.maxExecTimeSeconds) | nindent 4 }}
{{- end }}
