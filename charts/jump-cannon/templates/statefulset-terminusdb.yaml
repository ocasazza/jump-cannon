{{- include "jump-cannon.validateTerminusdb" . -}}
{{- if .Values.terminusdb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jump-cannon.terminusdbName" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminusdb
spec:
  type: ClusterIP
  selector:
    {{- include "jump-cannon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: terminusdb
  ports:
    - name: http
      port: {{ .Values.terminusdb.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "jump-cannon.terminusdbName" . }}
  labels:
    {{- include "jump-cannon.labels" . | nindent 4 }}
    app.kubernetes.io/component: terminusdb
spec:
  serviceName: {{ include "jump-cannon.terminusdbName" . }}
  # TerminusDB is single-writer; horizontal scale-out is not supported.
  replicas: 1
  selector:
    matchLabels:
      {{- include "jump-cannon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: terminusdb
  template:
    metadata:
      labels:
        {{- include "jump-cannon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: terminusdb
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: terminusdb
          image: {{ .Values.terminusdb.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6363
              protocol: TCP
          env:
            - name: TERMINUSDB_SERVER_PORT
              value: "6363"
            # The admin password always comes from a user-created Secret;
            # the chart refuses to render without one (see _helpers.tpl).
            - name: TERMINUSDB_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.terminusdb.adminPasswordSecret.name | quote }}
                  key: {{ .Values.terminusdb.adminPasswordSecret.key | quote }}
            # Headless backend for the session-manager; no dashboard.
            - name: TERMINUSDB_ENABLE_DASHBOARD
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/ok
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/ok
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/terminusdb/storage
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "jump-cannon.labels" . | nindent 10 }}
          app.kubernetes.io/component: terminusdb
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.terminusdb.persistence.storageClass }}
        storageClassName: {{ .Values.terminusdb.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.terminusdb.persistence.size | quote }}
{{- end }}
